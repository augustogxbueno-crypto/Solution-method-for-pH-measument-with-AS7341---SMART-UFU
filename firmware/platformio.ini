; pH measure with AS7341 — reflectance-only cuvette reader
;
; Two environments:
;  - as7341_esp32s3: native USB board, Web Serial works out of the box.
;  - uno: works too (compiles at ~91% flash / ~40% RAM on the ATmega328P),
;    but the Uno has NO native USB — it talks to the PC through a
;    USB-to-serial chip (ATmega16U2/CH340). Chrome/Edge's Web Serial API
;    still sees it as a normal serial port, so web/index.html works the
;    same way; just pick the Uno's COM port when you click "Connect via
;    USB". The only functional difference is DTR-triggered auto-reset on
;    that port, which does not affect this protocol.

[env:as7341_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/adafruit/Adafruit_AS7341.git
    https://github.com/adafruit/Adafruit_BusIO.git
    bblanchon/ArduinoJson@^6.21.5

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/adafruit/Adafruit_AS7341.git
    https://github.com/adafruit/Adafruit_BusIO.git
    bblanchon/ArduinoJson@^6.21.5
